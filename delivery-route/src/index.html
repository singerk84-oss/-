<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f5f7; --card: #fff; --ink: #1c1f24; --muted: #6b7280; --line: #e3e6ea;
      --accent: #fee500; --accent-ink: #191600; --ok: #138a4b; --warn: #b45309; --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    header { background: var(--ink); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 2; }
    header .title { font-size: 20px; font-weight: 700; }
    header .sub { font-size: 14px; color: #c9ced6; margin-top: 4px; }
    main { padding: 12px 16px 40px; max-width: 560px; margin: 0 auto; }
    .stop { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .stop.done { opacity: .6; }
    .stop.locked { opacity: .45; }
    .stop.current { border: 2px solid var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .row { display: flex; align-items: center; gap: 10px; }
    .no { width: 30px; height: 30px; border-radius: 50%; background: var(--line); display: flex; align-items: center;
      justify-content: center; font-weight: 700; flex: none; }
    .current .no { background: var(--accent); color: var(--accent-ink); }
    .done .no { background: var(--ok); color: #fff; }
    .name { font-size: 18px; font-weight: 700; }
    .addr { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .meta { font-size: 13px; color: var(--muted); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .meta b { color: var(--ink); font-weight: 600; }
    button { font: inherit; border: 0; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 700; width: 100%;
      cursor: pointer; }
    button:disabled { opacity: .5; }
    .btn-go { background: var(--accent); color: var(--accent-ink); margin-top: 12px; }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-sub { background: var(--line); color: var(--ink); }
    .btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 12px; }
    .navlink { display: block; text-align: center; margin-top: 8px; font-size: 14px; color: var(--ink); }
    .badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 6px; margin-right: 6px;
      vertical-align: 2px; }
    .badge.pickup { background: #dbeafe; color: #1e40af; }
    .badge.priority { background: #fee2e2; color: #991b1b; }
    .notice { background: #1e40af; color: #fff; padding: 12px 16px; font-size: 15px; display: none; }
    .navhint { text-align: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
    .panel { background: var(--card); border-radius: 14px; padding: 18px; border: 1px solid var(--line); margin-top: 16px; }
    .panel h2 { margin: 0 0 8px; font-size: 18px; }
    input { font: inherit; font-size: 20px; width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
      margin: 8px 0 12px; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: 16px; background: var(--danger); color: #fff; padding: 14px;
      border-radius: 12px; display: none; z-index: 5; }
    .muted { color: var(--muted); font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    td { padding: 6px 0; border-bottom: 1px solid var(--line); }
    td:last-child { text-align: right; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div class="title" id="title">불러오는 중…</div>
    <div class="sub" id="sub"></div>
  </header>
  <div class="notice" id="notice"></div>
  <main id="app"><p class="muted">회차 정보를 불러오는 중입니다.</p></main>
  <div class="toast" id="toast"></div>

<script>
  var P = <?!= params ?>;
  var state = null;
  var busy = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(function () { t.style.display = 'none'; }, 4000);
  }

  function call(fn, args, onOk) {
    if (busy) return;
    busy = true;
    render();
    var runner = google.script.run
      .withSuccessHandler(function (s) { busy = false; state = s; render(); if (onOk) onOk(s); })
      .withFailureHandler(function (e) { busy = false; render(); toast(e.message || String(e)); });
    runner[fn].apply(runner, [P].concat(args || []));
  }

  // 업체명 탭: 출발 기록이 저장된 뒤 TMAP 앱을 연다(앱으로 넘어가며 페이지를 떠나도 기록은 남는다)
  function go(i) {
    var s = state.stops[i];
    var url = s.nav ? s.nav.main : '';
    call('tapStop', [i, 'start'], function () { if (url) openTmap(url); });
  }

  function openTmap(url) {
    window.top.location.href = url;
  }

  function arrive(i) { call('tapStop', [i, 'arrive']); }
  function complete(i) {
    var s = state.stops[i];
    var msg = s.isReturn ? '회사에 복귀했습니까?' : s.name + (s.isPickup ? ' 상차(매입)를' : ' 하차를') + ' 완료했습니까?';
    if (confirm(msg)) call('tapStop', [i, 'complete']);
  }
  function closeDay() {
    var v = document.getElementById('odo').value.trim();
    if (!v || isNaN(Number(v))) { toast('계기판 주행거리를 숫자로 입력하세요.'); return; }
    if (confirm('계기판 주행거리 ' + v + 'km로 오늘 마감할까요? 한 번만 입력할 수 있습니다.')) call('submitClose', [Number(v)]);
  }

  function stopCard(s) {
    var cur = state.current === s.index;
    var cls = s.complete ? 'done' : (cur ? 'current' : 'locked');
    var label = s.isReturn ? '🏁' : (s.index + 1);
    var h = '<div class="stop ' + cls + '"><div class="row"><div class="no">' + label + '</div><div>' +
      '<div class="name">' + (s.isPickup ? '<span class="badge pickup">매입</span>' : '') +
      (s.isPriority ? '<span class="badge priority">★우선</span>' : '') + esc(s.name) + '</div>' +
      (s.address ? '<div class="addr">' + esc(s.address) + '</div>' : '') + '</div></div>';
    var meta = [];
    if (s.eta && !s.isReturn) meta.push('예상도착 <b>' + esc(s.eta) + '</b>');
    if (s.distKm !== '' && s.distKm != null) meta.push('구간 <b>' + esc(s.distKm) + 'km</b>');
    if (s.depart) meta.push('출발 <b>' + esc(s.depart) + '</b>');
    if (s.arrive) meta.push('도착 <b>' + esc(s.arrive) + '</b>');
    if (s.complete) meta.push('완료 <b>' + esc(s.complete) + '</b>');
    if (meta.length) h += '<div class="meta">' + meta.join('') + '</div>';

    if (cur) {
      var dis = busy ? ' disabled' : '';
      if (!s.depart) {
        h += '<button class="btn-go"' + dis + ' onclick="go(' + s.index + ')">' +
          (s.isReturn ? '회사로 복귀 출발' : esc(s.name) + '(으)로 출발') + '</button>';
      } else {
        h += '<div class="btns">' +
          (s.arrive ? '<button class="btn-sub" disabled>도착함</button>'
            : '<button class="btn-sub"' + dis + ' onclick="arrive(' + s.index + ')">도착</button>') +
          '<button class="btn-ok"' + dis + ' onclick="complete(' + s.index + ')">' +
          (s.isReturn ? '복귀 완료' : (s.isPickup ? '상차 완료' : '완료')) + '</button></div>';
        if (s.nav) {
          h += '<a class="navlink" href="' + esc(s.nav.main) + '" target="_top">' + esc(s.nav.mainLabel) + ' 길안내 다시 열기</a>';
          h += '<div class="navhint">TMAP이 열리지 않으면 앱 설치 여부를 확인하세요.</div>';
        }
      }
    }
    return h + '</div>';
  }

  function closePanel() {
    if (!state.tripDone) return '';
    if (!state.isLastTrip) {
      return '<div class="panel"><h2>회차 완료</h2><p class="muted">수고하셨습니다. 다음 회차 링크로 이어서 진행하세요.</p></div>';
    }
    if (state.closed) {
      var c = state.closed;
      return '<div class="panel"><h2>오늘 마감 완료</h2><table>' +
        '<tr><td>계기판</td><td>' + esc(c.odometer) + ' km</td></tr>' +
        '<tr><td>실주행(전일 대비)</td><td>' + (c.real === '' ? '-' : esc(c.real) + ' km') + '</td></tr>' +
        '<tr><td>API 합산</td><td>' + esc(c.api) + ' km</td></tr>' +
        '<tr><td>차이</td><td>' + (c.diff === '' ? '-' : esc(c.diff) + ' km') + '</td></tr></table></div>';
    }
    return '<div class="panel"><h2>오늘 마감</h2><p class="muted">오늘 마지막 회차입니다. 계기판 주행거리를 입력하세요.</p>' +
      '<input id="odo" type="number" inputmode="decimal" placeholder="예: 123456">' +
      '<button class="btn-go"' + (busy ? ' disabled' : '') + ' onclick="closeDay()">마감 입력</button></div>';
  }

  function render() {
    if (!state) return;
    document.getElementById('title').textContent = state.vehicleName + ' · ' + state.trip + '회차';
    document.getElementById('sub').textContent = state.date + (state.plate ? ' · ' + state.plate : '') +
      (state.driver ? ' · ' + state.driver : '');
    var odo = document.getElementById('odo');
    var odoVal = odo ? odo.value : '';
    document.getElementById('app').innerHTML = state.stops.map(stopCard).join('') + closePanel();
    var odo2 = document.getElementById('odo');
    if (odo2) odo2.value = odoVal;
  }

  // 운행 중 경유지가 추가될 수 있으므로 자동으로 다시 읽는다:
  // TMAP에서 돌아와 화면이 다시 보일 때, 그리고 화면을 켜 둔 동안 1분마다
  function signature(s) {
    return s.stops.map(function (x) { return (x.isPickup ? 'P' : 'D') + x.name; }).join('|');
  }
  function showNotice(msg) {
    var n = document.getElementById('notice');
    n.textContent = msg;
    n.style.display = 'block';
    setTimeout(function () { n.style.display = 'none'; }, 8000);
  }
  function refresh() {
    if (busy || !state) return;
    google.script.run
      .withSuccessHandler(function (s) {
        if (busy) return;
        var before = signature(state);
        var added = s.stops.length - state.stops.length;
        state = s;
        render();
        if (signature(s) !== before) {
          showNotice(added > 0 ? '경유지 ' + added + '곳이 추가되었습니다. 순서를 확인하세요.' : '경유지가 변경되었습니다. 순서를 확인하세요.');
        }
      })
      .withFailureHandler(function () { /* 통신 실패는 다음 갱신 때 다시 시도 */ })
      .getTripState(P);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') refresh();
  });
  setInterval(function () { if (document.visibilityState === 'visible') refresh(); }, 60000);

  google.script.run
    .withSuccessHandler(function (s) { state = s; render(); })
    .withFailureHandler(function (e) {
      document.getElementById('title').textContent = '오류';
      document.getElementById('app').innerHTML = '<p>' + esc(e.message || e) + '</p>';
    })
    .getTripState(P);
</script>
</body>
</html>
